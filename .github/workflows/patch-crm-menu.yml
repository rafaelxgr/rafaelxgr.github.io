name: Validate site navigation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check institutional navigation links
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          class HeaderLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_header = False
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'header':
                      self.in_header = True
                  if self.in_header and tag == 'a' and attrs.get('href'):
                      self.links.append(attrs['href'])

              def handle_endtag(self, tag):
                  if tag == 'header':
                      self.in_header = False

          pages = ['index.html', 'automacao.html', 'planos.html', 'projetos.html',
                   'sobre.html', 'contato.html', 'checkup-digital.html',
                   'orcamento.html', 'crm-comercial.html', 'diagnostico-xgreat.html',
                   'privacidade.html', 'cookies.html', 'food/index.html']
          root = Path.cwd()
          errors = []
          for name in pages:
              page = root / name
              parser = HeaderLinks()
              parser.feed(page.read_text(encoding='utf-8'))
              if not parser.links:
                  errors.append(f'{name}: header navigation not found')
              for href in parser.links:
                  url = urlsplit(href)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  target = root / unquote(url.path.lstrip('/')) if url.path.startswith('/') else page.parent / unquote(url.path)
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.is_file():
                      errors.append(f'{name}: missing target {href}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Navigation targets verified in {len(pages)} pages.')
          PY
