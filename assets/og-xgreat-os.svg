  <text x="72" y="220" fill="#39d7c3" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2">OPERAÇÃO DIGITAL PARA NEGÓCIOS REAIS</text>
  <text x="72" y="300" fill="#f6f8fb" font-family="Arial, sans-serif" font-size="54" font-weight="700">Sua operação digital,</text>
  <text x="72" y="370" fill="#ffe08a" font-family="Arial, sans-serif" font-size="60" font-weight="700">conectada.</text>
