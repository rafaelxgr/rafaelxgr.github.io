<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.58" stop-color="#08131f"/>
      <stop offset="1" stop-color="#15130d"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(170 100) rotate(35) scale(470 360)">
      <stop stop-color="#39d7c3" stop-opacity=".2"/>
