><rect x="16" y="384" width="188" height="36" rx="7" fill="#fff" stroke="none"/><text x="34" y="407" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">Produtos</text><rect x="16" y="429" width="188" height="36" rx="7" fill="#fff" stroke="none"/><text x="34" y="452" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">Datas e limites</text><rect x="16" y="474" width="188" height="36" rx="7" fill="#fff" stroke="none"/><text x="34" y="497" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">Configurações</text><rect x="16" y="519" width="188" height="36" rx="7" fill="#fff" stroke="none"/><text x="34" y="542" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">Histórico</text><text x="24" y="691" fill="#193e31" font-family="Arial, sans-serif" font-size="13" font-weight="700">XGreat OS Food</text><text x="24" y="714" fill="#737a70" font-family="Arial, sans-serif" font-size="11" font-weight="400">Operação digital organizada</text><rect x="220" y="32" width="980" height="60" rx="0" fill="#fff" stroke="#e7e7df"/><text x="248" y="69" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">XGreat OS Food / Encomendas</text><text x="250" y="134" fill="#8c7441" font-family="Arial, sans-serif" font-size="11" font-weight="700">XERIFE’S DO FRANGO · OPERAÇÃO</text><text x="250" y="179" fill="#202b25" font-family="Arial, sans-serif" font-size="30" font-weight="700">Produção por data</text><text x="250" y="209" fill="#737a70" font-family="Arial, sans-serif" font-size="15" font-weight="400">Produtos e quantidades para organizar o preparo.</text><rect x="250" y="240" width="907" height="113" rx="10" fill="#fff" stroke="#e7e7df"/><text x="272" y="273" fill="#202b25" font-family="Arial, sans-serif" font-size="21" font-weight="700">Lista de produção</text><text x="272" y="299" fill="#737a70" font-family="Arial, sans-serif" font-size="14" font-weight="400">Selecione uma data aprovada para organizar o preparo.</text><rect x="272" y="316" width="250" height="25" rx="5" fill="#fbfaf6" stroke="#e7e7df"/><text x="285" y="333" fill="#737a70" font-family="Arial, sans-serif" font-size="12" font-weight="400">Filtrar por data</text><rect x="976" y="263" width="155" height="42" rx="7" fill="#193e31" stroke="#e7e7df"/><text x="994" y="289" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Exportar CSV</text><rect x="250" y="376" width="907" height="209" rx="10" fill="#fff" stroke="#e7e7df"/><text x="271" y="409" fill="#202b25" font-family="Arial, sans-serif" font-size="19" font-weight="700">Produtos por data</text><rect x="270" y="430" width="864" height="38" rx="0" fill="#f8f7f0" stroke="#e7e7df"/><text x="285" y="455" fill="#737a70" font-family="Arial, sans-serif" font-size="12" font-weight="700">PRODUTO</text><text x="601" y="455" fill="#737a70" font-family="Arial, sans-serif" font-size="11" font-weight="700">SOLICITADO</text><text x="775" y="455" fill="#737a70" font-family="Arial, sans-serif" font-size="11" font-weight="700">CONFIRMADO E PAGO</text><text x="1002" y="455" fill="#737a70" font-family="Arial, sans-serif" font-size="11" font-weight="700">A PRODUZIR</text><text x="557" y="528" fill="#737a70" font-family="Arial, sans-serif" font-size="15" font-weight="400">Sem itens para exibir.</text><rect x="250" y="609" width="907" height="100" rx="10" fill="#e9eee7" stroke="#e7e7df"/><text x="274" y="641" fill="#193e31" font-family="Arial, sans-serif" font-size="18" font-weight="700">Operação e financeiro separados</text><text x="274" y="669" fill="#526053" font-family="Arial, sans-serif" font-size="14" font-weight="400">A produção considera pedidos pagos e confirmados.</text><text x="274" y="690" fill="#526053" font-family="Arial, sans-serif" font-size="13" font-weight="400">Comprovante enviado não confirma recebimento.</text><text x="250" y="740" fill="#737a70" font-family="Arial, sans-serif" font-size="10" font-weight="700">VISUAL ILUSTRATIVO DA INTERFACE IMPLEMENTADA</text></svg>